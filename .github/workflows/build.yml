name: Build Deadlock S2SDK Plugin

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'
  push:
    branches:
      - main

jobs:
  sync-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Shorten Working Path
        run: |
          subst B: "${{ github.workspace }}"

      - name: Resolve Local Tag
        id: get_tag
        shell: bash
        working-directory: B:/
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev")
          echo "Found tag: $TAG"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Clean Build Directory
        working-directory: B:/
        shell: bash
        run: |
          rm -rf build

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        working-directory: B:/
        run: >
          cmake --preset Release-Deadlock
          -DSOURCESDK_PROTOS="netmessages;network_connection;networkbasetypes;networksystem_protomessages;gameevents;usermessages;source2_steam_stats;valveextensions"

      - name: Build Plugin
        working-directory: B:/
        run: cmake --build --preset Release-Deadlock

      - name: Prepare Directory Structure
        shell: bash
        working-directory: B:/
        run: |
          BUILD_DIR="build/Windows/Deadlock/Release-Deadlock"
          PLUGIN_DIR="staging/game/citadel/addons/plugify/envs/plugins"
          mkdir -p "$PLUGIN_DIR/bin"
          mkdir -p "$PLUGIN_DIR/gamedata"
          find "$BUILD_DIR" -name "*s2sdk*.dll" -exec cp {} "$PLUGIN_DIR/bin/" \; || true
          find "$BUILD_DIR" -name "*.pplugin" -exec cp {} "$PLUGIN_DIR/" \; || true
          if [ -d "assets" ]; then
            cp -r assets/* "$PLUGIN_DIR/" 2>/dev/null || true
          fi
          cd staging
          7z a -tzip ../plugify-plugin-s2sdk-deadlock-build-win.zip .

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "${{ steps.get_tag.outputs.TAG }}-deadlock"
          name: "Deadlock Build ${{ steps.get_tag.outputs.TAG }}"
          body: "Automated Deadlock build from fork for plugify-plugin-s2sdk release ${{ steps.get_tag.outputs.TAG }}"
          files: B:/plugify-plugin-s2sdk-deadlock-build-win.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
